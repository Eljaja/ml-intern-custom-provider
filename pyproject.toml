[project]
name = "ml-intern"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core dependencies
    "datasets>=4.4.1",
    "pydantic>=2.12.3",
    "python-dotenv>=1.2.1",
    # Agent runtime dependencies
    "requests>=2.33.0",
    "litellm>=1.83.0",
    "boto3>=1.35.0",
    "huggingface-hub>=1.12.0",
    "fastmcp>=3.2.0",
    "prompt-toolkit>=3.0.0",
    "thefuzz>=0.22.1",
    "rich>=13.0.0",
    "nbconvert>=7.16.6",
    "nbformat>=5.10.4",
    "whoosh>=2.7.4",
    # Web backend dependencies
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "apscheduler>=3.10,<4",
    "pymongo>=4.17.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]

# Evaluation/benchmarking dependencies
eval = [
    "inspect-ai>=0.3.149",
    "pandas>=2.3.3",
    "datasets>=4.3.0",
    "tenacity>=8.0.0",
]

# Development and testing dependencies
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.15.12",
]

# All dependencies (eval + dev)
all = [
    "ml-intern[eval,dev]",
]

[project.scripts]
ml-intern = "agent.main:cli"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `configs` ships the JSON files loaded by agent.main.CLI_CONFIG_PATH at
# runtime (resolves to <site-packages>/configs/cli_agent_config.json).
# Without it, `uv tool install` / `pip install` produce a broken install
# that imports fine but crashes at startup with FileNotFoundError.
include = ["agent*", "configs"]

[tool.setuptools.package-data]
configs = ["*.json"]
# Agent data files: system prompts loaded by ContextManager._load_system_prompt
# at runtime (`<site-packages>/agent/prompts/system_prompt_v3.yaml`), plus the
# package README. Without these, headless_main hangs forever — submission_loop
# crashes with FileNotFoundError but headless_main doesn't check agent_task.done()
# and just keeps awaiting the "ready" event_queue item that will never come.
agent = ["README.md", "prompts/*.yaml"]

[tool.uv]
package = true

[tool.ruff]
# CI runs `ruff check .` + `ruff format --check .` (see .github/workflows/ci.yml).
# Without a config that was ruff's default rule set only — E4/E7/E9 + F, i.e.
# syntax errors and unused names. Everything below is what that missed.
target-version = "py312"

[tool.ruff.lint]
select = [
    "E4",     # imports (default)
    "E7",     # statement-level checks (default)
    "E9",     # runtime/syntax errors (default)
    "F",      # pyflakes (default) — caught the duplicated llm_params block
    "I",      # isort: import order drifted in every recent PR
    "B",      # bugbear: mutable defaults, raise-without-from, unused loop vars
    "UP",     # pyupgrade: repo is py312-only, keep the syntax there
    "ASYNC",  # blocking calls inside async def — real risk on the SSE backend
    "SIM",    # obvious simplifications
]
ignore = [
    # `try: ... except Exception: pass` is used deliberately across the agent
    # for best-effort paths (telemetry, cleanup, cache warmup) where a failure
    # must never surface. contextlib.suppress reads worse at those call sites.
    "SIM105",
    # `from typing import Iterable/Callable` -> collections.abc. Correct, but
    # the fix is marked unsafe by ruff and touches ~18 signatures across
    # modules nobody is otherwise editing. Deferred, not endorsed.
    "UP035",
    # ASYNC109 flags `async def f(..., timeout=...)` on the assumption the
    # timeout is hand-rolled. Ours are pass-throughs to httpx/litellm, which
    # implement the timeout natively; asyncio.timeout at the call site would be
    # strictly worse (it can't abort mid-read the way httpx can).
    "ASYNC109",
    # UP042 wants `class OpType(str, Enum)` -> StrEnum. Not equivalent:
    # StrEnum changes `str(member)` from "OpType.X" to the member value, and
    # these enums are stringified into events and persisted payloads.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Test helpers legitimately poll with sleep loops and open fixture files
# synchronously; the ASYNC rules target production request paths.
"tests/**" = ["ASYNC110", "ASYNC230", "ASYNC240"]
# The blocking `open` here is downstream of a blocking `hf_hub_download` in the
# same function — the whole helper is sync-in-async. Silencing only the `open`
# would be cosmetic: to actually unblock the event loop the download has to move
# to a thread too. Tracked separately rather than half-fixed here.
"agent/tools/hf_repo_files_tool.py" = ["ASYNC230", "ASYNC240"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI puts its dependency markers in default arguments by design; B008
# would flag every route in backend/routes/.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
