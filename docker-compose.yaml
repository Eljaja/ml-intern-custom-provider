# Start: docker compose up --build
# With GPU: requires NVIDIA Container Toolkit on the host; use --profile gpu or the default (gpus) below.
#
# Open UI:  http://localhost:8080  (API proxied to backend)
# API root: http://localhost:7860/api

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: ml-intern-backend:local
    container_name: ml-intern-backend
    env_file:
      - .env
    environment:
      # Browser origins when the frontend is on host port 8080 (mapped to container :80)
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost,http://127.0.0.1"
    ports:
      - "7860:7860"
    # GPU (NVIDIA Container Toolkit on the host). For CPU-only, remove the whole `gpus` block.
    gpus:
      - driver: nvidia
        count: all
        capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/api"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: ml-intern-frontend:local
    container_name: ml-intern-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    # Same Docker network: nginx proxies /api and /auth to `backend:7860` (see docker/nginx.conf)

networks:
  default:
    name: ml-intern-net
